<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='styling.css') }}">
    <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script defer src="{{ url_for('static', filename='Cycler.js') }}"></script>
    {% if config["DEV_MODE"] %}
    <script defer src="{{ url_for('static', filename='dev-reload.js') }}"></script>
    {% endif %}
    <title>Logan's RPI Webcam Cycler</title>
</head>
<body>
    <main>
        <div class="videoMainBlock">
            <div id="Active_slot" class="PlaybackSlot is-active">
                <iframe
                    id="iFrameElement"
                    class="VideoDisplayingItem"
                    title="Live webcam"
                    allow="autoplay; fullscreen; encrypted-media"
                    allowfullscreen
                    hidden>
                </iframe>
                <video
                    id="VideoElement"
                    class="VideoDisplayingItem"
                    autoplay
                    muted
                    playsinline
                    preload="auto"
                    controls
                    hidden>
                </video>
            </div>
            <button
                id="Previous_camera"
                class="Camera_navigation Camera_navigation--previous"
                type="button"
                aria-label="Previous camera">
            </button>
            <button
                id="Next_camera"
                class="Camera_navigation Camera_navigation--next"
                type="button"
                aria-label="Next camera">
            </button>
            <div class="MainTitle">
                <h1><span id="Webcam_location_description"></span></h1>
                <h2><span id="Webcam_local_time_"></span></h2>
                <p id="Playback_status" role="status" aria-live="polite"></p>
            </div>
        </div>
    </main>
</body>
</html>
